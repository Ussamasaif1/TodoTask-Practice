<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>JavaScript Playground</h1>

    <div class="card">

        <input
            type="text"
            id="inputBox"
            placeholder="Type something..."
        >

        <button id="btn">
            Add Items
        </button>

        <button id="btn2">
            Remove Background
        </button>
        <button id="reset">
            Reset
        </button>

        <p id="output">
            
        </p>
        <ul id="list">
            
        </ul>

    </div>
    <span id="counterUpdate">
        Total Tasks: 0
    </span>
    <span id="completed">
        Completed Tasks: 0
    </span>
    <span id="pendingCounter">
        Pending Tasks: 0
    </span>
</div>

<script src="script.js"></script>

</body>
</html>
